eureka:
    client:
        serviceUrl:
            defaultZone: http://localhost:8761/eureka/
server:
    port: ${PORT:8087}
spring:
    application:
        name: Registration-Service
    datasource:
        driverClassName: org.h2.Driver
        password: ''
        url: jdbc:h2:file:./data/Registration-db
        username: sa
    h2:
        console:
            enabled: true
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: update

app:
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:5173}
  jwt:
    secreto: ${JWT_SECRETO:JWT_SECRETO:THE-ICE-KEY-OF-ESPORT-ARENA-MANAGER}
    duracion-ms: 3600000

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
